[supervisord]
nodaemon=true

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1024x768x16
autorestart=true

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -nopw -forever -shared
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 10000 localhost:5900
autorestart=true

[program:chromium]
command=/usr/bin/chromium-browser --no-sandbox --disable-dev-shm-usage --start-maximized https://google.com
environment=DISPLAY=":1"
autorestart=true
